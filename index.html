<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوتيك السعادة | المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0a0a0a; --bg-card: #151515; --gold: #d4af37; --gold-glow: rgba(212,175,55,0.3); --pink: #e91e63; --pink-glow: rgba(233,30,99,0.4); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding-top: 60px; padding-bottom: 70px; overflow-x: hidden; }
        
        /* Header */
        .main-header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(10,10,10,0.95); border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 1000; }
        .header-center h1 { font-size: 18px; color: var(--gold); }
        
        /* Pages */
        .page { display: none; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Grids */
        .categories-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        
        /* Cards */
        .product-card { background: var(--bg-card); border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        .btn-buy { width: 100%; background: var(--pink); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        
        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; border: 1px solid var(--gold); }
    </style>
</head>
<body>

    <!-- المتجر -->
    <div id="store-view">
        <header class="main-header">
            <div><i class="fa-solid fa-bars"></i></div>
            <div class="header-center"><h1 id="store-name-display">بوتيك السعادة</h1></div>
            <div class="header-left">
                <!-- تم حذف زر الإدارة من هنا -->
            </div>
        </header>

        <main id="home-page" class="page active">
            <div style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://via.placeholder.com/600x300/111/333?text=Banner') center/cover; height: 200px; display: flex; align-items: center; padding: 20px; border-bottom: 2px solid var(--pink);">
                <div>
                    <h2 style="color: var(--gold);">لأن سعادتكم تستحق الأفضل</h2>
                    <p style="color: #aaa; margin-top: 10px;">اكتشف عالم المتعة .. منتجات عالية الجودة</p>
                </div>
            </div>
            <div style="padding: 15px;"><h3 style="color: var(--gold);">الأقسام</h3></div>
            <div id="categories-container" class="categories-grid"></div>
            <div style="padding: 15px;"><h3 style="color: var(--gold);">المنتجات الأكثر مبيعاً 🔥</h3></div>
            <div id="products-container" class="products-grid"></div>
        </main>
    </div>

    <script>
        // DB
        const defaultData = {
            settings: { storeName: "بوتيك السعادة", phone: "+966500000000", email: "support@happy.com" },
            categories: [
                { id: "1", name: "قضبان صناعية", image: "https://via.placeholder.com/100/000/fff?text=Dildo" },
                { id: "2", name: "السدادات", image: "https://via.placeholder.com/100/000/fff?text=Plug" },
                { id: "3", name: "الطقات والتأخير", image: "https://via.placeholder.com/100/000/fff?text=Ring" },
                { id: "4", name: "الزيوت والجل", image: "https://via.placeholder.com/100/000/fff?text=Oil" }
            ],
            products: [
                { id: "p1", name: "قضيب سيليكون واقعي", price: 399, oldPrice: 599, categoryId: "1", image: "https://via.placeholder.com/150/111/fff?text=Product", rating: 4.8, sales: 124 },
                { id: "p2", name: "مجموعة سدادات", price: 289, oldPrice: 0, categoryId: "2", image: "https://via.placeholder.com/150/111/fff?text=Product", rating: 4.9, sales: 89 }
            ],
            stats: { todaySales: 1450, todayOrders: 5, totalSales: 25400 }
        };

        function getStoreData() {
            let data = localStorage.getItem('happyBoutiqueDB');
            if (!data) { localStorage.setItem('happyBoutiqueDB', JSON.stringify(defaultData)); return defaultData; }
            return JSON.parse(data);
        }
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        let storeData = getStoreData();

        // Store Logic
        function renderStore() {
            document.getElementById('store-name-display').innerText = storeData.settings.storeName;
            const catContainer = document.getElementById('categories-container');
            catContainer.innerHTML = storeData.categories.map(cat => `
                <div style="text-align: center;">
                    <div style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid #d4af37; margin: 0 auto 5px; overflow: hidden;">
                        <img src="${cat.image}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <span style="font-size: 12px;">${cat.name}</span>
                </div>
            `).join('');

            const prodContainer = document.getElementById('products-container');
            prodContainer.innerHTML = storeData.products.map(prod => `
                <div class="product-card">
                    <div style="height: 120px;"><img src="${prod.image}" style="width: 100%; height: 100%; object-fit: cover;"></div>
                    <div style="padding: 10px;">
                        <h4 style="font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${prod.name}</h4>
                        <div style="font-size: 12px; color: #d4af37;"><i class="fa-solid fa-star"></i> ${prod.rating}</div>
                        <div style="margin: 5px 0;"><span style="color: #e91e63; font-weight: bold;">${prod.price} ر.س</span></div>
                        <button class="btn-buy">اطلب الآن</button>
                    </div>
                </div>
            `).join('');
        }

        // Init
        renderStore();
    </script>
</body>
</html>
